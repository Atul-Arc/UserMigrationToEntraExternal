<style>
  :host {
    --bright-blue: oklch(51.01% 0.274 263.83);
    --electric-violet: oklch(53.18% 0.28 296.97);
    --french-violet: oklch(47.66% 0.246 305.88);
    --vivid-pink: oklch(69.02% 0.277 332.77);
    --hot-red: oklch(61.42% 0.238 15.34);
    --orange-red: oklch(63.32% 0.24 31.68);

    --gray-900: oklch(19.37% 0.006 300.98);
    --gray-700: oklch(36.98% 0.014 302.71);
    --gray-400: oklch(70.9% 0.015 304.04);

    --red-to-pink-to-purple-vertical-gradient: linear-gradient(
      180deg,
      var(--orange-red) 0%,
      var(--vivid-pink) 50%,
      var(--electric-violet) 100%
    );

    --red-to-pink-to-purple-horizontal-gradient: linear-gradient(
      90deg,
      var(--orange-red) 0%,
      var(--vivid-pink) 50%,
      var(--electric-violet) 100%
    );

    --pill-accent: var(--bright-blue);

    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
      "Segoe UI Symbol";
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  h1 {
    font-size: 3.125rem;
    color: var(--gray-900);
    font-weight: 500;
    line-height: 100%;
    letter-spacing: -0.125rem;
    margin: 0;
    font-family: "Inter Tight", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
      "Segoe UI Symbol";
  }

  p {
    margin: 0;
    color: var(--gray-700);
  }

  main {
    width: 100%;
    min-height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1rem;
    box-sizing: inherit;
    position: relative;
  }

  .angular-logo {
    max-width: 9.2rem;
  }

  .content {
    display: flex;
    justify-content: space-around;
    width: 100%;
    max-width: 700px;
    margin-bottom: 3rem;
  }

  .content h1 {
    margin-top: 1.75rem;
  }

  .content p {
    margin-top: 1.5rem;
  }

  .divider {
    width: 1px;
    background: var(--red-to-pink-to-purple-vertical-gradient);
    margin-inline: 0.5rem;
  }

  .pill-group {
    display: flex;
    flex-direction: column;
    align-items: start;
    flex-wrap: wrap;
    gap: 1.25rem;
  }

  .pill {
    display: flex;
    align-items: center;
    --pill-accent: var(--bright-blue);
    background: color-mix(in srgb, var(--pill-accent) 5%, transparent);
    color: var(--pill-accent);
    padding-inline: 0.75rem;
    padding-block: 0.375rem;
    border-radius: 2.75rem;
    border: 0;
    transition: background 0.3s ease;
    font-family: var(--inter-font);
    font-size: 0.875rem;
    font-style: normal;
    font-weight: 500;
    line-height: 1.4rem;
    letter-spacing: -0.00875rem;
    text-decoration: none;
    white-space: nowrap;
  }

  .pill:hover {
    background: color-mix(in srgb, var(--pill-accent) 15%, transparent);
  }

  .pill-group .pill:nth-child(6n + 1) {
    --pill-accent: var(--bright-blue);
  }
  .pill-group .pill:nth-child(6n + 2) {
    --pill-accent: var(--electric-violet);
  }
  .pill-group .pill:nth-child(6n + 3) {
    --pill-accent: var(--french-violet);
  }

  .pill-group .pill:nth-child(6n + 4),
  .pill-group .pill:nth-child(6n + 5),
  .pill-group .pill:nth-child(6n + 6) {
    --pill-accent: var(--hot-red);
  }

  .pill-group svg {
    margin-inline-start: 0.25rem;
  }

  .social-links {
    display: flex;
    align-items: center;
    gap: 0.73rem;
    margin-top: 1.5rem;
  }

  .social-links path {
    transition: fill 0.3s ease;
    fill: var(--gray-400);
  }

  .social-links a:hover svg path {
    fill: var(--gray-900);
  }

  @media screen and (max-width: 650px) {
    .content {
      flex-direction: column;
      width: max-content;
    }

    .divider {
      height: 1px;
      width: 100%;
      background: var(--red-to-pink-to-purple-horizontal-gradient);
      margin-block: 1.5rem;
    }
  }

  /* Header and footer */
  .site-header {
    width: 100%;
    padding: 0.75rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    box-sizing: inherit;
    border-bottom: 1px solid rgba(255, 255, 255, 0.25);
    background: #17458C;
    color: #ffffff;
  }

  .brand a { color: inherit; text-decoration: none; font-size: 1rem; }

  .site-header .pill {
    background: #ffffff;
    color: #0b5fff;
  }

  .site-header .pill:hover {
    background: rgba(255, 255, 255, 0.92);
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .user-menu { position: relative; display: inline-flex; align-items: center; }
  .user-menu-button { display: inline-flex; align-items: center; gap: 4px; }
  .user-dropdown {
    position: absolute;
    right: 0;
    top: calc(100% + 6px);
    background: white;
    border: 1px solid rgba(0,0,0,0.06);
    border-radius: 6px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    z-index: 40;
  }

  .user-dropdown-link {
    display: block;
    padding: 6px 10px;
    color: var(--pill-accent);
    text-decoration: none;
    border-radius: 4px;
    background: transparent;
    text-align: left;
    font-weight: 400;
    white-space: nowrap;
  }
  .user-dropdown-link:hover {
    background: color-mix(in srgb, var(--pill-accent) 8%, transparent);
  }

  .site-footer {
    width: 100%;
    padding: 1rem 1.25rem;
    text-align: center;
    color: var(--gray-700);
    border-top: 1px solid rgba(0,0,0,0.04);
    margin-top: 2rem;
    font-size: 0.9rem;
  }

  .site-footer a { color: var(--pill-accent); text-decoration: none; margin: 0 0.5rem; }
</style>

<header class="site-header">
  <div class="brand">
    <a href="/">Agents Portal</a>
  </div>
  <nav class="nav-links" aria-label="Primary">
    <div class="user-menu" *ngIf="isLoggedIn()">
      <button class="pill user-menu-button" type="button" (click)="toggleMenu()" [attr.aria-expanded]="showMenu()">
        {{ userName() }}
        <svg style="width:12px;height:12px;margin-left:6px;" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden>
          <path d="M5 7l5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="user-dropdown" *ngIf="showMenu()">
        <a class="user-dropdown-link" href="#" (click)="changePassword(); $event.preventDefault()">Change Password</a>
        <a class="user-dropdown-link" href="#" (click)="logout(); $event.preventDefault()">Sign Out</a>
      </div>
    </div>
    <button class="pill" *ngIf="!isLoggedIn()" type="button" (click)="login()">Sign In</button>
  </nav>
</header>

<!-- debug panel removed -->

<main class="main">
  <router-outlet></router-outlet>
</main>

  <div>
    <a href="/privacy-policy">Privacy Policy</a>
    <a href="/terms">Terms of Use</a>
    <a href="/copyright">Copyright</a>
  </div>
  <div style="margin-top:0.5rem;color:var(--gray-700);">© <span id="year">2026</span> Agents Portal</div>
</footer>
